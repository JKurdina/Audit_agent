# Конфигурация моделей для Audit Hypothesis Agent
#
# Логика resolve_model_path():
#   1. Если папка local_path существует → используется локальная копия (быстро)
#   2. Если не существует → модель скачивается с HuggingFace Hub ПРЯМО в local_path
#      При следующем запуске папка уже есть → скачивания не будет
#
# force_hub: true → принудительно скачать заново (например, для обновления весов)
#
# Где хранятся модели:
#   Пути указаны относительно рабочей директории ноутбука.
#   По умолчанию: <папка_ноутбука>/models/<имя_модели>/
#   Чтобы изменить базовую папку — отредактируй local_path ниже.

models:
  llm:
    local_path: "models/Qwen_Qwen2.5-7B-Instruct"
    hub_id: "Qwen/Qwen2.5-7B-Instruct"
    force_hub: false

  embedder:
    local_path: "models/BAAI_bge-m3"
    hub_id: "BAAI/bge-m3"
    force_hub: false

  reranker:
    local_path: "models/BAAI_bge-reranker-v2-m3"
    hub_id: "BAAI/bge-reranker-v2-m3"
    force_hub: false
